name: APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          mkdir www
          cp dunya-turu.html www/index.html
          curl -fL -o www/three.min.js https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js#three.min.js#' www/index.html
          cat > www/dbg.js <<'EOF'
          window.onerror=function(m,s,l){var d=document.createElement('pre');d.style.cssText='position:fixed;top:70px;left:8px;right:8px;color:#fff;font-size:12px;z-index:99;white-space:pre-wrap';d.textContent=m+' @'+l;document.body.appendChild(d)};
          EOF
          sed -i 's#<body>#<body><script src="dbg.js"></script>#' www/index.html
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Dünya Turu" com.dunyaturu.app --web-dir=www
          node -e "const f='capacitor.config.json';const c=JSON.parse(require('fs').readFileSync(f));c.backgroundColor='#07111f';require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
          npx cap add android
          npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: dunya-turu-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
